# ============================================================
# recyclarr.yml — Quality Profiles & Custom Formats (TRaSH Guides)
#
# Recyclarr v8: Profile werden guide-backed per trash_id gesynct —
# Qualities, Custom Formats, Scores und Language kommen komplett
# aus den TRaSH Guides (German-EN-Profile):
#   Radarr: [German] Remux + WEB 2160p
#     https://trash-guides.info/Radarr/radarr-setup-quality-profiles-german-en/
#   Sonarr: [German] UHD Remux + WEB
#     https://trash-guides.info/Sonarr/sonarr-setup-quality-profiles-german-en/
# → Dual Language (DE+EN) bevorzugt, englischer Fallback erlaubt,
#   Remux > Bluray > WEB, HDR/DV-Handling inklusive.
#
# Zusätzlich (nicht guide-backed, hier ausformuliert):
#   Sonarr: [German] 1080p + DVD — für ältere Serien, die es nicht in HD gibt.
#     Basis ist das Guide-Profil "[German] HD Bluray + WEB" (dca7e5e9…),
#     erweitert um HDTV, Bluray-576p/480p, DVD, WEB 480p und SDTV.
#     Alles liegt in EINER Quality-Group → die Auswahl entscheidet der
#     Custom-Format-Score, nicht die Qualitätsstufe. Damit gewinnt eine
#     deutsche DVD gegen ein englisches 1080p, und sobald ein deutsches
#     1080p auftaucht, wird per Score (1080p + German 1080p Booster)
#     automatisch hochgestuft.
#
# Sync (macht bootstrap/06-recyclarr.sh):
#   docker run --rm --network arr_net \
#     -e RADARR_API_KEY -e SONARR_API_KEY \
#     -v ./recyclarr:/config ghcr.io/recyclarr/recyclarr:8.6.0 sync
# ============================================================

radarr:
  radarr-main:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: 79faa9943cef2f510b997b1f2a9f3ea6 # [German] Remux + WEB 2160p
      - trash_id: bf3cc2e99ad9a804a9b0d0e538e1fbba # [German] Anime HD Bluray + WEB

    custom_formats:
      ### HDR / DV — Scores aus dem Guide
      - trash_ids:
          - 923b6abef9b17f937fab56cfcf89e1f1 # DV (w/o HDR fallback) — Strafe für inkompatible DV-only-Releases
          - b337d6812e06c200ec9a2d3cfa9d20a7 # DV Boost
          - caa37d0df9c348912df1fb1d88f9273a # HDR10+ Boost
        assign_scores_to:
          - trash_id: 79faa9943cef2f510b997b1f2a9f3ea6

sonarr:
  sonarr-main:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 08cececf1840290f6fd490b7d79e8642 # [German] UHD Remux + WEB
      - trash_id: 6fe5937e1dcc2269e23b49eb46dfe6d6 # [German] Anime HD Bluray + WEB

      # ---- Ältere Serien: deutsch in 1080p, sonst DVD/SD -------------------
      - name: "[German] 1080p + DVD"
        score_set: german # German DL zählt +11000 statt -10000
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: "1080p → DVD" # = die Merge-Gruppe unten
          until_score: 35000
        min_format_score: 0 # englischer Fallback bleibt erlaubt (Score 0)
        min_upgrade_format_score: 1
        quality_sort: top
        qualities:
          # EINE Gruppe: HD und SD gleichrangig, der CF-Score entscheidet.
          - name: "1080p → DVD"
            qualities:
              - Bluray-1080p
              - WEBRip-1080p
              - WEBDL-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
              - Bluray-576p
              - Bluray-480p
              - DVD
              - WEBDL-480p
              - WEBRip-480p
              - SDTV

    custom_formats:
      ### HDR / DV — Scores aus dem Guide
      - trash_ids:
          - 9b27ab6498ec0f31a3353992e19434ca # DV (w/o HDR fallback) — Strafe für inkompatible DV-only-Releases
          - 7c3a61a9c6cb04f52f1544be6d44a026 # DV Boost
          - 0c4b99df9206d2cfac3c05ab897dd62a # HDR10+ Boost
        assign_scores_to:
          - trash_id: 08cececf1840290f6fd490b7d79e8642

      ### [German] 1080p + DVD — CF-Set des Guide-Profils "[German] HD Bluray + WEB"
      # (nicht guide-backed → die Formate müssen hier explizit zugewiesen werden)
      - trash_ids:
          # Sprache
          - ed51973a811f51985f14e2f6f290e47a # German DL            (+11000)
          - c5dd0fd675f85487ad5bdf97159180bd # German DL (undefined)
          - 8a9fcdbb445f2add0505926df3bb7b8a # German              (+10000)
          - 133589380b89f8f8394320901529bac1 # Not German or English (-35000)
          # Auflösung — hebt 1080p über 720p über SD/DVD
          - 9aa0ca0d2d66b6f6ee51fc630f46cf6f # German 1080p Booster
          - 290078c8b266272a5cc8e251b5e2eb0b # 1080p
          - c99279ee27a154c2f20d1d505cc99e25 # 720p
          # Release-Gruppen-Tiers (deutsch)
          - 7940b2fb0278f27cf4f70187f2be95d6 # German Bluray Tier 01
          - 83b336a90d90d6b35ca673b007f80661 # German Bluray Tier 02
          - d8f8e1539827967e0e564833e6c08d33 # German Bluray Tier 03
          - 68be37323132b35cf333c81a2ac8fc16 # German Web Tier 01
          - f51b96a50b0e6196cb69724b7833d837 # German Web Tier 02
          - bda67c2c0aae257308a4723d92475b86 # German Web Tier 03
          - c2eec878fa1989599c226ce4c287d6a7 # German Scene
          # Release-Gruppen-Tiers (englischer Fallback)
          - d6819cba26b1a6508138d25fb5e32293 # HD Bluray Tier 01
          - c2216b7b8aa545dc1ce8388c618f8d57 # HD Bluray Tier 02
          - e6258996055b9fbab7e9cb2f75819294 # WEB Tier 01
          - 58790d4e2fdcd9733aa7ae68ba2bb503 # WEB Tier 02
          - d84935abd3f8556dcd51d4f27e22d0a6 # WEB Tier 03
          # Repacks/Propers
          - ec8fa7296b64e8cd390a1600981f3923 # Repack/Proper
          - eb3d5cc0a2be0db205fb823640db6a3c # Repack2
          - 44e7c4de10ae50265753082e5dc76047 # Repack3
        assign_scores_to:
          - name: "[German] 1080p + DVD"
